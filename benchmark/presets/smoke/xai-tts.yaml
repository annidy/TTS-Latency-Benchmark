schema_version: 2
suite: {id: smoke-xai-tts, description: xAI TTS HTTP and persistent WS smoke}
catalog: [../catalog/xai.yaml]
targets:
  - model: xai.tts
    transports: [http, websocket]
execution: {profiles: [{id: warm, connection_mode: persistent, provider_execution: serial, warmup_runs: 1, repetitions: 1}]}
texts: {ref: ../texts/smoke-en.yaml}
clients: [{id: local, region_env: TTFA_CLIENT_REGION, runner: {kind: local}}]
outputs: {base_dir: outputs/runs}
